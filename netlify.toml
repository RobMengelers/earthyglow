[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "24"

# Canonical host: serve the apex, never www.
[[redirects]]
  from = "https://www.earthyglow.nl/*"
  to = "https://earthyglow.nl/:splat"
  status = 301
  force = true

[dev]
  command = "react-router dev"
