[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "24"

# Canonical host: serve www, never apex.
[[redirects]]
  from = "https://earthyglow.nl/*"
  to = "https://www.earthyglow.nl/:splat"
  status = 301
  force = true

[dev]
  command = "react-router dev"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
